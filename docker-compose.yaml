# Local development stack — mirrors the Railway deployment exactly.
#
# Prerequisites:
#   cp .env.example .env.local   # fill in RAILWAY_TOKEN, ADMIN_KEY, etc.
#   just dev
#
# The app container runs start.sh which handles:
#   - mesahub-server (embedded, auto-generated token, if MESAHUB_URL=mh://local/...)
#   - node backend
#   - Caddy (frontend + reverse proxy on http://localhost:8080)

services:
  app:
    container_name: railway-manage
    build: .
    ports:
      - "${PORT:-8080}:80"
    env_file:
      - .env.local
    volumes:
      - data:/data
    restart: unless-stopped

volumes:
  data:
