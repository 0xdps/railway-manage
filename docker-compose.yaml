volumes:
  backend_node_modules:

services:
  # BACKEND - Dev mode (hot reload with node --watch)
  backend:
    container_name: railway-manage-backend
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
    volumes:
      - ./services/backend:/app/services/backend
      - backend_node_modules:/app/services/backend/node_modules  # Don't override precompiled Linux modules
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # FRONTEND - Dev only (Vite hot reload)
  frontend:
    container_name: railway-manage-frontend
    profiles: ["dev"]
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.dev
    expose:
      - "5173"
    environment:
      VITE_API_URL: http://backend:3000
      NODE_ENV: development
    volumes:
      - ./services/frontend/src:/app/src
      - ./services/frontend/public:/app/public:ro
      - ./services/frontend/index.html:/app/index.html:ro
      - ./services/frontend/package.json:/app/package.json:ro
      - ./services/frontend/vite.config.js:/app/vite.config.js:ro
      - ./services/frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./services/frontend/postcss.config.js:/app/postcss.config.js:ro
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  # CADDY - Reverse proxy (dev mode)
  caddy:
    container_name: railway-manage-caddy
    profiles: ["dev"]
    image: caddy:2-alpine
    # No fixed host port — Docker assigns a random one, detected by `just dev`
    ports:
      - "${CADDY_INTERNAL_PORT:-8080}"
    command:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/Caddyfile <<EOF
        :$${CADDY_INTERNAL_PORT:-8080} {
          handle /api/* {
            reverse_proxy backend:3000
          }

          handle /health {
            reverse_proxy backend:3000
          }

          handle {
            reverse_proxy frontend:5173 {
              header_up Connection {>Connection}
              header_up Upgrade {>Upgrade}
            }
          }

          log {
            output stdout
            format console
          }
        }
        EOF
        caddy fmt --overwrite /tmp/Caddyfile
        exec caddy run --config /tmp/Caddyfile
    environment:
      - CADDY_INTERNAL_PORT=${CADDY_INTERNAL_PORT:-8080}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:${CADDY_INTERNAL_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PRODUCTION APP - Unified build (Caddy + Node backend)
  app:
    container_name: railway-manage
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "${APP_INTERNAL_PORT:-8080}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${APP_INTERNAL_PORT:-8080}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_INTERNAL_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
